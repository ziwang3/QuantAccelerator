[project]
name = "quantaccelerator"
version = "0.1.0"
description = "A multi-agent copilot for quant research: understand a dataset, prove when each record was knowable, audit pipelines for look-ahead, and build return-blind features"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "matplotlib>=3.8", "pydantic>=2.6", "openai>=1.40", "pypdf>=4",
                "langgraph>=1.2", "langgraph-checkpoint-sqlite>=3.1", "langchain>=1.4", "langchain-core>=1.6", "mcp>=1.30",
                "langchain-mcp-adapters>=0.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebook = ["jupyterlab>=4", "ipython"]
tracing = ["arize-phoenix-otel>=0.17", "openinference-instrumentation-langchain", "openinference-instrumentation-openai"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
