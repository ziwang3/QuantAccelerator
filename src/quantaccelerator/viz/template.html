<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuantAccelerator · A multi-agent helper for quant research</title>
<style>
/* QuantAccelerator, dark fintech theme.
   Data colours are the dataviz reference palette's dark steps, re-validated on this surface (#0f1729): 4 categorical
   slots pass CVD, normal-vision and 3:1 contrast. Each pipeline variant keeps one colour everywhere. Status colours are
   reserved and always paired with an icon + label. The brand gradient is used only for brand and navigation, never
   for data. */
:root {
  color-scheme: dark;
  --bg: #070b16; --bg-2: #0a1020; --card: #0f1729; --card-2: #131d34; --card-3: #19243f;
  --line: rgba(148,163,184,0.14); --line-2: rgba(148,163,184,0.26);
  --text: #eaf0fa; --text-2: #a8b3c7; --muted: #6e7a92;
  --brand-a: #6aa8ff; --brand-b: #3ee0c5; --brand: linear-gradient(135deg, #6aa8ff 0%, #3ee0c5 100%);
  --glow: rgba(106,168,255,0.18);
  --slot1: #3987e5; --slot2: #d95926; --slot3: #199e70; --slot4: #c98500;
  --seq: #3987e5;
  --good: #0ca30c; --good-text: #3fcf5a; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --critical-text: #ff7b7b;
  --critical-wash: rgba(208,59,59,0.20); --neutral-wash: rgba(148,163,184,0.08);
  --code-hl: rgba(208,59,59,0.16); --code-add: rgba(12,163,12,0.16);
  --radius: 16px;
  --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
  background: radial-gradient(1200px 600px at 15% -10%, rgba(106,168,255,0.10), transparent 60%),
              radial-gradient(900px 500px at 100% 0%, rgba(62,224,197,0.07), transparent 60%), var(--bg);
  color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button { font: inherit; }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 28px; padding: 14px 32px;
          background: rgba(7,11,22,0.78); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.brand .word { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.brand .word span { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nav { display: flex; gap: 4px; }
.nav button { background: transparent; border: 0; color: var(--text-2); padding: 8px 14px; border-radius: 10px; cursor: pointer;
              font-size: 14px; font-weight: 500; }
.nav button:hover { color: var(--text); background: rgba(148,163,184,0.08); }
.nav button[aria-current="page"] { color: var(--text); background: rgba(106,168,255,0.12); box-shadow: inset 0 0 0 1px rgba(106,168,255,0.28); }
.topbar .spacer { flex: 1; }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--brand); transition: width .35s ease; }

.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 12px; padding: 10px 16px; font-size: 14px;
       font-weight: 600; cursor: pointer; border: 1px solid var(--line-2); background: rgba(148,163,184,0.06); color: var(--text); }
.btn:hover { background: rgba(148,163,184,0.12); }
.btn.primary { background: var(--brand); color: #04101f; border: 0; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 6px 12px; font-size: 13px; border-radius: 10px; }

main { max-width: 1240px; margin: 0 auto; padding: 40px 32px 24px; }
.page { display: none; animation: fade .45s ease both; } .page.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- typography ---------- */
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand-b); margin-bottom: 14px; }
.eyebrow .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--brand-b); margin-right: 8px; vertical-align: 2px;
                box-shadow: 0 0 10px var(--brand-b); }
h1 { font-size: clamp(40px, 5.2vw, 64px); line-height: 1.04; letter-spacing: -0.035em; margin: 0 0 20px; font-weight: 700; }
h1 .grad { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
h2 { font-size: clamp(28px, 3.2vw, 40px); line-height: 1.12; letter-spacing: -0.025em; margin: 0 0 14px; font-weight: 700; }
h3 { font-size: 17px; line-height: 1.3; margin: 0 0 8px; font-weight: 650; letter-spacing: -0.01em; }
h4 { font-size: 13px; margin: 0 0 10px; font-weight: 650; color: var(--text-2); text-transform: uppercase; letter-spacing: .08em; }
.lede { font-size: 19px; line-height: 1.55; color: var(--text-2); max-width: 820px; margin: 0 0 28px; }
.lede.wide { max-width: none; }
p { line-height: 1.6; color: var(--text-2); margin: 0 0 12px; }
.muted { color: var(--muted); } .t2 { color: var(--text-2); }
.num { font-variant-numeric: tabular-nums; }
strong { color: var(--text); font-weight: 650; }

/* ---------- layout ---------- */
.section { margin-top: 56px; } .section:first-child { margin-top: 0; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 980px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } }
.card { background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01)), var(--card);
        border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; position: relative; }
.card.hi { border-color: rgba(106,168,255,0.35); box-shadow: 0 0 0 1px rgba(106,168,255,0.10), 0 20px 60px -20px var(--glow); }
.card .icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 16px;
              background: rgba(106,168,255,0.10); border: 1px solid rgba(106,168,255,0.25); color: var(--brand-a); }
.card .icon svg { width: 20px; height: 20px; }
.kpi { font-size: 44px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin: 6px 0 8px; }
.hero { padding: 36px 0 12px; }
.hero-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 48px; align-items: center; }
@media (max-width: 980px) { .hero-grid { grid-template-columns: 1fr; } }
.cta { display: flex; gap: 12px; flex-wrap: wrap; }
.divider { height: 1px; background: var(--line); margin: 40px 0; }
.quote { border-left: 2px solid var(--brand-b); padding: 6px 0 6px 18px; color: var(--text); font-size: 18px; line-height: 1.5; }

/* badges & status */
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
         border-radius: 99px; padding: 4px 10px; border: 1px solid var(--line-2); color: var(--text-2); white-space: nowrap; }
.badge.built { color: #9fe8d9; border-color: rgba(62,224,197,0.40); background: rgba(62,224,197,0.08); }
.badge.planned { color: var(--muted); border-style: dashed; }
.badge.progress { color: #bcd6ff; border-color: rgba(106,168,255,0.40); background: rgba(106,168,255,0.08); }
.status { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; color: var(--text); }
.status .ico { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 800; flex: none; }
.st-good .ico { background: var(--good); } .st-critical .ico { background: var(--critical); }
.st-serious .ico { background: var(--serious); } .st-warning .ico { background: var(--warning); color: #111; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: 0; flex: none; }

/* ---------- framework diagram ---------- */
.lane { display: grid; grid-template-columns: 170px 1fr; gap: 20px; align-items: center; padding: 22px 0; border-top: 1px solid var(--line); }
.lane:first-of-type { border-top: 0; }
.lane .lname { font-weight: 650; } .lane .lname small { display: block; color: var(--muted); font-weight: 500; margin-top: 4px; font-size: 12px; line-height: 1.4; }
.flow { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; row-gap: 14px; }
.fnode { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 128px; max-width: 170px; }
.fnode .n { font-size: 13px; font-weight: 650; } .fnode .o { font-size: 11px; color: var(--muted); margin-top: 3px; font-family: var(--mono); }
.fnode.gate { border-radius: 99px; min-width: auto; padding: 10px 14px; display: flex; align-items: center; gap: 6px; }
.fnode.gate .n { font-size: 12px; }
.fsep { display: flex; align-items: center; color: var(--muted); padding: 0 8px; font-size: 14px; }
.agent { display: flex; flex-direction: column; gap: 8px; }
.agent .writes { font-family: var(--mono); font-size: 12px; color: var(--brand-a); }

/* ---------- module stepper ---------- */
.modhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 28px; }
.steps { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 5px; }
.steps button { border: 0; background: transparent; color: var(--text-2); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
.steps button .i { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 11px; margin-right: 6px;
                   background: rgba(148,163,184,0.12); color: var(--text-2); }
.steps button[aria-current="step"] { background: var(--card-3); color: var(--text); }
.steps button[aria-current="step"] .i { background: var(--brand); color: #04101f; }
.step { display: none; } .step.active { display: block; animation: fade .4s ease both; }

/* data used panel */
.facts { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; }
@media (max-width: 980px) { .facts { grid-template-columns: 1fr 1fr; } }
.fact { background: var(--card-2); padding: 14px 16px; }
.fact .v { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; } .fact .l { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.variant { display: flex; gap: 12px; align-items: flex-start; }
.variant .sw { width: 4px; align-self: stretch; border-radius: 4px; flex: none; }
.variant code { font-family: var(--mono); font-size: 12px; color: var(--text-2); background: rgba(148,163,184,0.08); padding: 2px 6px; border-radius: 6px; }

/* ---------- charts ---------- */
svg text { fill: var(--text-2); font-size: 12px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
svg .t1 { fill: var(--text); } svg .tm { fill: var(--muted); }
svg .halo { paint-order: stroke; stroke: var(--card); stroke-width: 6px; stroke-linejoin: round; }
svg .grid { stroke: rgba(148,163,184,0.12); stroke-width: 1; } svg .axis { stroke: rgba(148,163,184,0.30); stroke-width: 1; }
svg [tabindex]:focus { outline: none; } svg [tabindex]:focus-visible circle:last-child, svg [tabindex]:focus-visible path { stroke: var(--text); stroke-width: 2; }
.tooltip { position: fixed; pointer-events: none; background: rgba(15,23,41,0.96); border: 1px solid var(--line-2); border-radius: 10px;
           padding: 10px 12px; font-size: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.45); z-index: 30; max-width: 340px; display: none; backdrop-filter: blur(8px); }
.tooltip .v { font-weight: 700; color: var(--text); font-size: 14px; } .tooltip .l { color: var(--text-2); }
.tooltip .row + .row { margin-top: 4px; }
details.data { margin-top: 14px; font-size: 13px; } details.data summary { cursor: pointer; color: var(--muted); }
table { border-collapse: collapse; font-size: 13px; width: 100%; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }

/* ---------- KPI tiles ---------- */
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
.tile .label { color: var(--text-2); font-size: 13px; font-weight: 500; }
.tile .value { font-size: 46px; font-weight: 700; margin: 8px 0 6px; line-height: 1; letter-spacing: -0.03em; }
.tile .delta { font-size: 13px; color: var(--text-2); } .tile .delta.up { color: var(--good-text); }

/* ---------- replay ---------- */
.replay { display: grid; grid-template-columns: 290px minmax(0,1fr); gap: 20px; }
@media (max-width: 980px) { .replay { grid-template-columns: 1fr; } }
.chain { display: flex; flex-direction: column; gap: 0; position: relative; }
.node { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--card-2); transition: all .25s ease; position: relative; }
.node + .link { height: 18px; margin-left: 26px; border-left: 2px dashed var(--line-2); }
.node .nm { font-weight: 650; font-size: 14px; display: flex; align-items: center; gap: 10px; }
.node .av { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 800;
            background: rgba(148,163,184,0.12); color: var(--text-2); flex: none; }
.node .desc { color: var(--muted); font-size: 12px; margin: 6px 0 0 36px; line-height: 1.4; }
.node .ctr { color: var(--text-2); font-size: 12px; margin: 6px 0 0 36px; font-variant-numeric: tabular-nums; }
.node .pill { margin-left: auto; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border-radius: 99px; padding: 3px 8px;
              background: rgba(148,163,184,0.10); color: var(--muted); }
.node.active { border-color: rgba(106,168,255,0.6); box-shadow: 0 0 0 4px rgba(106,168,255,0.10), 0 10px 40px -10px var(--glow); }
.node.active .av { background: var(--brand); color: #04101f; }
.node.active .pill { background: rgba(106,168,255,0.18); color: #cfe0ff; }
.node.done .av { background: rgba(62,224,197,0.16); color: var(--brand-b); }
.node.done .pill { background: rgba(12,163,12,0.18); color: var(--good-text); }
.node.fail .pill { background: rgba(208,59,59,0.22); color: var(--critical-text); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.controls select { background: var(--card-2); color: var(--text); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px 10px; font: inherit; font-size: 13px; }
.controls input[type=range] { flex: 1; min-width: 140px; accent-color: var(--brand-a); }
.clock { font-size: 12px; color: var(--muted); min-width: 180px; text-align: right; font-variant-numeric: tabular-nums; }
.feed { height: 540px; overflow-y: auto; border: 1px solid var(--line); border-radius: 14px; background: rgba(7,11,22,0.55); padding: 10px; }
.feed::-webkit-scrollbar { width: 8px; } .feed::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; }
.ev { border-radius: 10px; padding: 9px 12px; margin: 4px 0; font-size: 13px; line-height: 1.45; border: 1px solid transparent; }
.ev .h { display: flex; gap: 10px; align-items: baseline; }
.ev .who { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; min-width: 62px; }
.ev .t { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ev .body { color: var(--text-2); margin-top: 3px; }
.ev.tool .body { font-family: var(--mono); font-size: 12px; color: #b9c7e0; }
.ev.big { border-color: var(--line); background: var(--card-2); }
.ev.alert { border-color: rgba(208,59,59,0.45); background: linear-gradient(90deg, rgba(208,59,59,0.14), transparent 70%), var(--card-2); }
.ev.ok { border-color: rgba(12,163,12,0.35); background: linear-gradient(90deg, rgba(12,163,12,0.10), transparent 70%), var(--card-2); }
.ev.new { animation: pop .35s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.chip { font-family: var(--mono); font-size: 11px; background: rgba(106,168,255,0.08); border: 1px solid rgba(106,168,255,0.22); border-radius: 6px; padding: 1px 7px; color: #bcd6ff; }
.ev details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 4px; }
pre { white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; background: rgba(7,11,22,0.7); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; margin: 8px 0 0; max-height: 340px; overflow: auto; color: #cdd7ea; }

/* ---------- code ---------- */
.code { font-family: var(--mono); font-size: 13px; background: rgba(7,11,22,0.75); border: 1px solid var(--line); border-radius: 12px; padding: 10px 0; overflow-x: auto; }
.code .ln { display: flex; white-space: pre; padding: 1px 14px; color: #c9d4e8; }
.code .ln .no { color: #4b5770; width: 34px; flex: none; text-align: right; margin-right: 16px; user-select: none; }
.code .ln.hl { background: var(--code-hl); box-shadow: inset 3px 0 0 var(--critical); }
.code .ln.add { background: var(--code-add); box-shadow: inset 3px 0 0 var(--good); }
.code .ln .tag { margin-left: 18px; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .04em; }

/* ---------- data research ---------- */
.figcard { background: #fff; border-radius: 10px; padding: 6px; margin-top: 10px; }
.figcard img { width: 100%; display: block; }
.sev { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border-radius: 99px; padding: 3px 8px; }
.sev.info { background: rgba(106,168,255,0.14); color: #bcd6ff; } .sev.warning { background: rgba(250,178,25,0.16); color: #f7c75c; }
.sev.issue { background: rgba(208,59,59,0.20); color: var(--critical-text); }
.steplog { counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steplog li { counter-increment: s; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--text-2); }
.steplog li::before { content: counter(s); display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
                      background: rgba(148,163,184,0.12); color: var(--text-2); font-size: 11px; margin-right: 10px; }

/* ---------- roadmap ---------- */
.road { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; }
@media (max-width: 980px) { .road { grid-template-columns: 1fr; } }
.road .card ul { margin: 10px 0 0; padding-left: 18px; color: var(--text-2); line-height: 1.7; font-size: 14px; }

/* ---------- explorer ---------- */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.tabs button { border: 1px solid var(--line-2); background: var(--card); color: var(--text-2); border-radius: 99px; padding: 8px 14px;
               font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; }
.tabs button[aria-pressed="true"] { color: var(--text); border-color: rgba(106,168,255,0.6); background: rgba(106,168,255,0.10); }
.stack > * + * { margin-top: 18px; }

footer { max-width: 1240px; margin: 48px auto 0; padding: 22px 32px 36px; border-top: 1px solid var(--line); display: flex; align-items: center;
         justify-content: space-between; color: var(--muted); font-size: 13px; }
footer .word { font-weight: 700; color: var(--text-2); }
footer .word span { background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
.navfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 36px; }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 6px; color: var(--muted); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand" id="brand" title="QuantAccelerator home">
    <span class="word">Quant<span>Accelerator</span></span>
  </div>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <span class="spacer"></span>
  <button class="btn small" id="btn-explorer">Run explorer</button>
  <div class="progress" id="progress"></div>
</header>
<main id="app"></main>
<footer><span class="word">Quant<span>Accelerator</span> · A multi-agent helper for quant research</span><span id="foot-right"></span></footer>
<div class="tooltip" id="tip" role="status"></div>

<script id="demo-data" type="application/json">/*__DATA__*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("demo-data").textContent);
const PRODUCT = "QuantAccelerator";
const MODS = D.modules;                                   // one entry per case study (form4, alfred, ...)
const MOD = Object.fromEntries(MODS.map(m => [m.id, m]));
const F4 = MOD.form4;
const AGENTS = {profiler: ["P", "Data Profiler", "Reads raw tables and the vendor's docs, writes a DatasetCard"],
                overview: ["O", "Overview", "Writes what the dataset is: publisher, market, entities, values"],
                data_research: ["R", "Data Research Agent", "Studies coverage, missing data, distributions and breaks; proposes cleaning"],
                research_eda_survey: ["S", "EDA Survey", "Characterizes every raw field against liquidity, size and sector"],
                research_eda_ideas: ["I", "EDA Ideas", "Brainstorms feature ideas and translates the researcher's"],
                research_eda: ["E", "Research EDA Agent", "Builds and characterizes the approved ideas, proposes features"],

    showExtra(X, 0); };
  const pick = m => { M = m; [...mtabs.children].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m === m.id)));
    tabs.replaceChildren(...M.variants.map(v => el("button", {"data-v": v, onclick: () => show(v)}, el("span", {class: "key", style: `background:${vcolor(M, v)}`}), M.short[v])));
    show(M.variants.find(v => M.runs[v]) || M.variants[0]); };
  EXTRA.filter(X => X.id === "x-research").forEach(X => mtabs.append(el("button", {"data-m": X.id, onclick: () => pickExtra(X)}, X.name)));
  MODS.forEach(m => mtabs.append(el("button", {"data-m": m.id, onclick: () => pick(m)}, m.name)));
  EXTRA.filter(X => X.id === "x-eda").forEach(X => mtabs.append(el("button", {"data-m": X.id, onclick: () => pickExtra(X)}, X.name)));
  wrap.append(el("div", {}, el("div", {class: "eyebrow"}, "Run explorer"), el("h2", {}, "Every step of every run"),
                 el("p", {class: "lede"}, "For research discussion: replay each run step by step, and inspect the agents' structured outputs, costs and, for audits, the exact code they changed.")), mtabs, tabs, body);
  pick(M);
  return wrap;
}

function navfoot(prev, next, nextLabel) {
  return el("div", {class: "navfoot"}, prev ? el("button", {class: "btn", onclick: () => go(prev)}, "← Back") : el("span"),
    el("span", {class: "muted", style: "font-size:12px"}, el("span", {class: "kbd"}, "←"), " ", el("span", {class: "kbd"}, "→"), "  to navigate"),
    next ? el("button", {class: "btn primary", onclick: () => go(next)}, `${nextLabel} →`) : el("span"));
}

/* ================= shell ================= */
const PAGES = [["mission", "Mission", pageMission], ["framework", "Framework", pageFramework],
               ...(D.research ? [["mod-research", "Data Research", pageResearch]] : []),
               ...MODS.map(m => [`mod-${m.id}`, m.name, () => pageModule(m)]),
               ...(D.eda ? [["mod-eda", "Research EDA", pageEDA]] : []),
               ...(D.predict ? [["mod-predict", "Predictive EDA", pagePredict]] : [])];
const MOD_STEPS = 5;                                      // problem, agents, evidence, catch, results
const app = document.getElementById("app"), nav = document.getElementById("nav");
const built = {};
let current = "mission";
PAGES.forEach(([id, label]) => nav.append(el("button", {"data-p": id, onclick: () => go(id)}, label)));
function page(id) { if (!built[id]) { const f = id === "explorer" ? pageExplorer : PAGES.find(p => p[0] === id)[2]; built[id] = el("div", {class: "page"}, f()); } return built[id]; }
const stepperOf = id => id.startsWith("mod-") ? page(id).firstChild.stepper : null;
function go(id) {
  current = id; hideTip();
  app.replaceChildren(page(id)); page(id).classList.add("active");
  [...nav.children].forEach(b => b.setAttribute("aria-current", b.dataset.p === id ? "page" : "false"));
  window.scrollTo({top: 0}); updateProgress();
}
function updateProgress() {
  const seq = [];
  PAGES.forEach(([id]) => { if (id.startsWith("mod-")) for (let i = 0; i < (id === "mod-eda" ? 6 : id === "mod-predict" ? 5 : MOD_STEPS); i++) seq.push(`${id}:${i}`); else seq.push(id); });
  const st = current.startsWith("mod-") && built[current] ? built[current].firstChild.stepper : null;
  const i = seq.indexOf(current.startsWith("mod-") ? `${current}:${st ? st.cur : 0}` : current);
  document.getElementById("progress").style.width = i < 0 ? "0" : `${((i + 1) / seq.length) * 100}%`;
}
document.getElementById("brand").onclick = () => go("mission");
document.getElementById("btn-explorer").onclick = () => go("explorer");
document.addEventListener("keydown", e => {
  if ((e.target instanceof Element && e.target.closest("input,select,textarea")) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const fwd = e.key === "ArrowRight", ids = PAGES.map(p => p[0]), i = ids.indexOf(current);
  const st = stepperOf(current);
  if (st) { if (fwd && st.cur < st.n - 1) return st.set(st.cur + 1); if (!fwd && st.cur > 0) return st.set(st.cur - 1); }
  if (i < 0) return; const j = i + (fwd ? 1 : -1);
  if (j >= 0 && j < ids.length) { go(ids[j]); const s2 = stepperOf(ids[j]); if (s2 && !fwd) s2.set(s2.n - 1); }
});
document.getElementById("foot-right").textContent = "Replay of recorded runs";
go("mission");
</script>
